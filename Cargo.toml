[package]
name = "vault-plugin-btc"
version = "0.1.0"
edition = "2021"

[dependencies]
# gRPC
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
prost-types = "0.13"
tonic-health = "0.12"

# Async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Bitcoin
bdk_wallet = "1.1"
bitcoin = "0.32"
miniscript = "12"
bip39 = { version = "2", features = ["rand"] }

# TLS
rcgen = "0.13"
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"

# Utilities
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.11"
